<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Pagar com PIX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --surface2: #1c1c28;
      --border: #2a2a3d;
      --accent: #00e5a0;
      --accent2: #7c3aed;
      --text: #f0f0f8;
      --muted: #6b6b8a;
      --danger: #ff4d6d;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Syne', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 24px 16px 40px;
      overflow-x: hidden;
    }

    /* animated grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,229,160,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,160,.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .glow-orb {
      position: fixed;
      width: 320px; height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(124,58,237,.18) 0%, transparent 70%);
      top: -80px; right: -80px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
    }

    /* header */
    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .pix-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0,229,160,.1);
      border: 1px solid rgba(0,229,160,.25);
      border-radius: 99px;
      padding: 4px 14px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 12px;
    }

    .pix-badge::before {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,100% { opacity: 1; transform: scale(1); }
      50% { opacity: .5; transform: scale(.8); }
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -.02em;
      line-height: 1.1;
    }

    h1 span { color: var(--accent); }

    /* card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 16px;
    }

    /* amount input */
    .amount-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
      display: block;
    }

    .amount-row {
      display: flex;
      align-items: center;
      gap: 0;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      transition: border-color .2s;
    }

    .amount-row:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,229,160,.12);
    }

    .currency {
      padding: 0 12px;
      font-family: 'DM Mono', monospace;
      font-size: 16px;
      font-weight: 500;
      color: var(--accent);
      border-right: 1px solid var(--border);
      height: 52px;
      display: flex;
      align-items: center;
    }

    #amount {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 22px;
      font-weight: 500;
      padding: 0 14px;
      height: 52px;
      width: 100%;
    }

    #amount::placeholder { color: var(--muted); }

    /* quick amounts */
    .quick-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 16px 0 8px;
      display: block;
    }

    .quick-btns {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .quick-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 4px;
      cursor: pointer;
      transition: all .15s;
      text-align: center;
    }

    .quick-btn:hover, .quick-btn.active {
      background: rgba(0,229,160,.12);
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-1px);
    }

    /* description */
    .desc-row {
      margin-top: 14px;
    }

    #desc {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      padding: 12px 14px;
      outline: none;
      transition: border-color .2s;
      resize: none;
    }

    #desc:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,229,160,.12); }
    #desc::placeholder { color: var(--muted); }

    /* generate btn */
    .btn-generate {
      width: 100%;
      background: var(--accent);
      color: #050a07;
      border: none;
      border-radius: 14px;
      font-family: 'Syne', sans-serif;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: .02em;
      padding: 16px;
      cursor: pointer;
      margin-top: 18px;
      transition: all .2s;
      position: relative;
      overflow: hidden;
    }

    .btn-generate::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,.15) 0%, transparent 50%);
    }

    .btn-generate:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,229,160,.35); }
    .btn-generate:active { transform: translateY(0); }

    /* QR section */
    .qr-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px 24px;
      text-align: center;
      display: none;
      animation: slideUp .3s ease;
    }

    .qr-card.visible { display: block; }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .qr-amount-display {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: .05em;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .qr-value {
      font-family: 'DM Mono', monospace;
      font-size: 30px;
      font-weight: 500;
      color: var(--accent);
      margin-bottom: 4px;
    }

    .qr-desc-text {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 20px;
      min-height: 18px;
    }

    /* QR wrapper — white bg so QR is always visible */
    .qr-wrapper {
      display: inline-block;
      background: #ffffff;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: 0 0 0 1px rgba(255,255,255,.1), 0 12px 40px rgba(0,0,0,.5);
    }

    #qrcode canvas, #qrcode img { display: block; }

    /* copy pix code */
    .copy-row {
      display: flex;
      gap: 8px;
    }

    .pix-code-box {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: left;
      cursor: default;
    }

    .btn-copy {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 16px;
      cursor: pointer;
      white-space: nowrap;
      transition: all .15s;
    }

    .btn-copy:hover { border-color: var(--accent); color: var(--accent); }
    .btn-copy.copied { background: rgba(0,229,160,.15); border-color: var(--accent); color: var(--accent); }

    /* new payment btn */
    .btn-new {
      width: 100%;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--muted);
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 600;
      padding: 12px;
      cursor: pointer;
      margin-top: 12px;
      transition: all .15s;
    }

    .btn-new:hover { border-color: var(--text); color: var(--text); }

    /* key info */
    .key-info {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 16px;
      padding: 10px 14px;
      background: rgba(124,58,237,.1);
      border: 1px solid rgba(124,58,237,.2);
      border-radius: 10px;
      font-size: 12px;
      color: #a78bfa;
    }

    .key-info strong {
      font-family: 'DM Mono', monospace;
      font-weight: 500;
    }

    /* error */
    .error-msg {
      color: var(--danger);
      font-size: 12px;
      margin-top: 6px;
      display: none;
    }
    .error-msg.show { display: block; }
  </style>
</head>
<body>
  <div class="glow-orb"></div>
  <div class="container">

    <div class="header">
      <div class="pix-badge">PIX Instantâneo</div>
      <h1>Gerar <span>QR Code</span></h1>
    </div>

    <!-- input card -->
    <div class="card" id="inputCard">
      <label class="amount-label" for="amount">Valor do pagamento</label>
      <div class="amount-row">
        <span class="currency">R$</span>
        <input type="number" id="amount" placeholder="0,00" min="0.01" step="0.01" inputmode="decimal" />
      </div>
      <div class="error-msg" id="errMsg">Informe um valor válido maior que R$ 0,00</div>

      <span class="quick-label">Valores rápidos</span>
      <div class="quick-btns">
        <button class="quick-btn" data-val="6">R$6</button>
        <button class="quick-btn" data-val="8">R$8</button>
        <button class="quick-btn" data-val="15">R$15</button>
        <button class="quick-btn" data-val="20">R$20</button>
      </div>

      <button class="btn-generate" id="btnGenerate">Gerar QR Code →</button>
    </div>

    <!-- qr card -->
    <div class="qr-card" id="qrCard">
      <div class="qr-amount-display">Valor a pagar</div>
      <div class="qr-value" id="qrValue">R$ 0,00</div>
      <div class="qr-wrapper">
        <div id="qrcode"></div>
      </div>

      <div class="copy-row">
        <div class="pix-code-box" id="pixCodeBox">—</div>
        <button class="btn-copy" id="btnCopy">Copiar</button>
      </div>

      <div class="key-info">
        🔑 Chave PIX: <strong>41980566844</strong>
      </div>

      <button class="btn-new" id="btnNew">← Novo pagamento</button>
    </div>

  </div>

  <script>
    // ── PIX EMV payload builder ──────────────────────────────────────────────
    function crc16(str) {
      let crc = 0xFFFF;
      for (let i = 0; i < str.length; i++) {
        crc ^= str.charCodeAt(i) << 8;
        for (let j = 0; j < 8; j++) {
          crc = (crc & 0x8000) ? (crc << 1) ^ 0x1021 : crc << 1;
        }
      }
      return ((crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0'));
    }

    function tlv(id, value) {
      return id + String(value.length).padStart(2, '0') + value;
    }

    function buildPixPayload(key, amount, desc) {
      const merchantAccount =
        tlv('00', 'BR.GOV.BCB.PIX') +
        tlv('01', key);

      const mInfo = tlv('26', merchantAccount);

      const amtStr = parseFloat(amount).toFixed(2);

      let addInfo = tlv('05', desc && desc.trim() ? desc.trim() : '***');
      const addData = tlv('62', addInfo);

      let payload =
        tlv('00', '01') +           // payload version
        mInfo +                      // merchant account
        tlv('52', '0000') +          // MCC
        tlv('53', '986') +           // BRL
        tlv('54', amtStr) +          // amount
        tlv('58', 'BR') +            // country
        tlv('59', 'Recebedor') +     // merchant name
        tlv('60', 'Brasil') +        // city
        addData;                     // additional data

      payload += '6304';             // CRC tag, length 04
      payload += crc16(payload);
      return payload;
    }

    // ── UI ───────────────────────────────────────────────────────────────────
    const PIX_KEY = '41980566844';

    const amountInput = document.getElementById('amount');
    const btnGenerate = document.getElementById('btnGenerate');
    const btnNew      = document.getElementById('btnNew');
    const btnCopy     = document.getElementById('btnCopy');
    const errMsg      = document.getElementById('errMsg');
    const inputCard   = document.getElementById('inputCard');
    const qrCard      = document.getElementById('qrCard');
    const qrValue     = document.getElementById('qrValue');
    const qrDesc      = document.getElementById('qrDesc');
    const qrCodeDiv   = document.getElementById('qrcode');
    const pixCodeBox  = document.getElementById('pixCodeBox');

    // quick buttons — apenas soma, sem seleção visual
    document.querySelectorAll('.quick-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const add = parseFloat(btn.dataset.val);
        const current = parseFloat(amountInput.value) || 0;
        amountInput.value = parseFloat((current + add).toFixed(2));
        errMsg.classList.remove('show');
      });
    });

    amountInput.addEventListener('input', () => {
      document.querySelectorAll('.quick-btn').forEach(b => b.classList.remove('active'));
      errMsg.classList.remove('show');
    });

    btnGenerate.addEventListener('click', generate);
    amountInput.addEventListener('keydown', e => { if (e.key === 'Enter') generate(); });

    function generate() {
      const val = parseFloat(amountInput.value);
      if (!val || val <= 0) { errMsg.classList.add('show'); return; }
      errMsg.classList.remove('show');

      const payload = buildPixPayload(PIX_KEY, val, '');

      // update display
      qrValue.textContent = 'R$ ' + val.toFixed(2).replace('.', ',');
      pixCodeBox.textContent = payload;

      // clear & draw QR
      qrCodeDiv.innerHTML = '';
      new QRCode(qrCodeDiv, {
        text: payload,
        width: 220,
        height: 220,
        colorDark: '#000000',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });

      inputCard.style.display = 'none';
      qrCard.classList.add('visible');
    }

    btnNew.addEventListener('click', () => {
      qrCard.classList.remove('visible');
      inputCard.style.display = 'block';
      amountInput.value = '';
      document.querySelectorAll('.quick-btn').forEach(b => b.classList.remove('active'));
    });

    btnCopy.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(pixCodeBox.textContent);
        btnCopy.textContent = '✓ Copiado';
        btnCopy.classList.add('copied');
        setTimeout(() => {
          btnCopy.textContent = 'Copiar';
          btnCopy.classList.remove('copied');
        }, 2000);
      } catch {
        btnCopy.textContent = 'Erro';
        setTimeout(() => { btnCopy.textContent = 'Copiar'; }, 2000);
      }
    });
  </script>
</body>
</html>
